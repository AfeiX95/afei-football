<script>
    var fontCurrent = 2;
    var fontSize = [12, 14, 16, 18, 20, 24];
    var sLocation = window.location.toString().toLowerCase();
    var sUserAgent = navigator.userAgent.toLowerCase();
    var bIsIpad = sUserAgent.match(/ipad/i) == "ipad";
    var bIsIphoneOs = sUserAgent.match(/iphone os/i) == "iphone os";
    var bIsMidp = sUserAgent.match(/midp/i) == "midp";
    var bIsUc7 = sUserAgent.match(/rv:1.2.3.4/i) == "rv:1.2.3.4";
    var bIsUc = sUserAgent.match(/ucweb/i) == "ucweb";
    var bIsAndroid = sUserAgent.match(/android/i) == "android";
    var bIsCE = sUserAgent.match(/windows ce/i) == "windows ce";
    var bIsWM = sUserAgent.match(/windows mobile/i) == "windows mobile";
    var bIsMobile = bIsIphoneOs || bIsMidp || bIsUc7 || bIsUc || bIsAndroid || bIsCE || bIsWM;

    function fontUp() {
        if (getQueryString('isapp') == 'undefined') {
            return;
        }

        if ((fontCurrent + 1) >= fontSize.length)
            return;

        fontCurrent += 1;
        var ps = document.getElementById('content').getElementsByTagName('p');
        var ps2 = document.getElementById('content').getElementsByTagName('span');
        for (var i = 0; i < ps.length; i++) {
            ps[i].style.fontSize = fontSize[fontCurrent] + 'px';
        }
        for (var j = 0; j < ps2.length; j++) {
            ps2[j].style.fontSize = fontSize[fontCurrent] + 'px';
        }
        document.getElementById('content').style.fontSize = fontSize[fontCurrent] + 'px';
    }

    function fontDown() {
        if (getQueryString('isapp') == 'undefined') {
            return;
        }

        if ((fontCurrent - 1) < 0)
            return;

        fontCurrent -= 1;
        var ps = document.getElementById('content').getElementsByTagName('p');
        var ps2 = document.getElementById('content').getElementsByTagName('span');
        for (var i = 0; i < ps.length; i++) {
            ps[i].style.fontSize = fontSize[fontCurrent] + 'px';
        }
        for (var j = 0; j < ps2.length; j++) {
            ps2[j].style.fontSize = fontSize[fontCurrent] + 'px';
        }
        document.getElementById('content').style.fontSize = fontSize[fontCurrent] + 'px';
    }

    function loadImg() {
        if (typeof(ref) == 'undefined') return;
        for (var i = 0; i < ref.length; i++) {
            var id = ref[i]["id"];
            if (document.getElementById('img' + id) != null)
                document.getElementById('img' + id).src = document.getElementById('img' + id).getAttribute('srcTarget');
        }
    }
